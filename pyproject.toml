[project]
name = "ozon-collector"
version = "0.1.0"
description = "Ozon Seller API data collector — DiRetail."
requires-python = ">=3.12"
dependencies = [
    "litestar[prometheus]>=2.15",
    "uvicorn>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-json-logger>=3.2",
    "prometheus-client>=0.21",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"
